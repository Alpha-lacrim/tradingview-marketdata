name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timescale: ["true", "false"]
    services:
      postgres:
        image: timescale/timescaledb:2.25.1-pg17
        env:
          POSTGRES_USER: marketdata
          POSTGRES_PASSWORD: marketdata
          POSTGRES_DB: marketdata_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketdata -d marketdata_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://marketdata:marketdata@localhost:5432/marketdata_test
      TEST_DATABASE_URL: postgresql://marketdata:marketdata@localhost:5432/marketdata_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.27"
          python-version: "3.12"
      - run: uv sync --frozen --extra databento
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic -x timescale=${{ matrix.timescale }} upgrade head
      - run: uv run pytest -q
      - run: uv run alembic downgrade base
      - run: uv run alembic -x timescale=${{ matrix.timescale }} upgrade head
