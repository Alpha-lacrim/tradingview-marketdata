# Isolated Batch 2 databases. No deployment env files or persistent Docker volumes.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: batch2_test
      POSTGRES_PASSWORD: disposable_test
      POSTGRES_DB: marketdata_batch2_test
    ports:
      - "127.0.0.1:55691:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batch2_test -d marketdata_batch2_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  timescale:
    image: timescale/timescaledb:2.25.1-pg17
    environment:
      POSTGRES_USER: batch2_test
      POSTGRES_PASSWORD: disposable_test
      POSTGRES_DB: marketdata_batch2_test
    ports:
      - "127.0.0.1:55692:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batch2_test -d marketdata_batch2_test"]
      interval: 2s
      timeout: 2s
      retries: 30
