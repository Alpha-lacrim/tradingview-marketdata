# Disposable validation only. Never combine this file with production Compose files.
# docker compose -p fastapi-batch1-tests -f compose.fastapi-test.yaml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fastapi_test
      POSTGRES_PASSWORD: disposable_test
      POSTGRES_DB: fastapi_batch1_test
    ports:
      - "127.0.0.1:55481:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi_test -d fastapi_batch1_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  timescale:
    image: timescale/timescaledb:2.25.1-pg17
    environment:
      POSTGRES_USER: fastapi_test
      POSTGRES_PASSWORD: disposable_test
      POSTGRES_DB: fastapi_batch1_test
    ports:
      - "127.0.0.1:55482:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastapi_test -d fastapi_batch1_test"]
      interval: 2s
      timeout: 2s
      retries: 30
