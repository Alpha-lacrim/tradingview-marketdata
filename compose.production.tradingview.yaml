# Apply after compose.production.yaml; preserves the existing accuracy-selected 100 sources.
# Uses the same reviewed MARKETDATA_IMAGE and mounted collector secret as the base file.
services:
  collector:
    environment:
      REGISTRY_FILE: config/instruments.tradingview-100.json
      MARKET_DATA_PROVIDER_CRYPTO: tradingview_guest
      MARKET_DATA_PROVIDER_FOREX: tradingview_guest
      MARKET_DATA_PROVIDER_METALS: tradingview_guest
      MARKET_DATA_PROVIDER_ENERGY: tradingview_guest
      MARKET_DATA_PROVIDER_FUTURES: disabled
      TRADINGVIEW_PRODUCTION_ACCESS_APPROVED: ${TRADINGVIEW_PRODUCTION_ACCESS_APPROVED:-true}
      TRADINGVIEW_STORAGE_MODE: candles
      TRADINGVIEW_CANDLE_POOL_ENABLED: "true"
      TRADINGVIEW_CANDLE_CONCURRENCY: "2"
      CANDLE_POOL_CONNECTIONS: "4"
      CANDLE_POOL_WORKER_CAPACITY: "100"
      CANDLE_POOL_MAX_INSTRUMENTS: "100"
      CANDLE_POOL_CONCURRENCY: "8"
      CANDLE_POOL_CONNECT_INTERVAL_SECONDS: "2"
      CANDLE_FETCH_GRACE_SECONDS: "5"
      CANDLE_POOL_DEADLINE_SECONDS: "48"
      CANDLE_POOL_CLEANUP_SECONDS: "3"
