# Isolated milestone 3B only; no collector, persistent volume or provider connection.
services:
  postgres:
    image: postgres:16.1
    container_name: marketdata-v11-m3b-pg16-test
    labels: {marketdata.task: v11-m3b}
    environment:
      POSTGRES_USER: m3b_test
      POSTGRES_PASSWORD: disposable_test
      POSTGRES_DB: marketdata_v11_m3b_test
    ports: ["127.0.0.1:55985:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U m3b_test -d marketdata_v11_m3b_test"]
      interval: 2s
      timeout: 2s
      retries: 30
  timescale:
    image: timescale/timescaledb:2.25.1-pg17
    container_name: marketdata-v11-m3b-ts-test
    labels: {marketdata.task: v11-m3b}
    environment:
      POSTGRES_USER: m3b_test
      POSTGRES_PASSWORD: disposable_test
      POSTGRES_DB: marketdata_v11_m3b_test
    ports: ["127.0.0.1:55986:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U m3b_test -d marketdata_v11_m3b_test"]
      interval: 2s
      timeout: 2s
      retries: 30
