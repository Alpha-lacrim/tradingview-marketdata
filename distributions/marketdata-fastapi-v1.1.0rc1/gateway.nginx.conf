# Include this fragment within the company gateway http{} context.
# Adapt to company-approved TLS gateway. No Authorization/query values in access logs.
limit_req_zone $binary_remote_addr zone=md_ingest:10m rate=4r/s;
map $http_upgrade $md_connection { default upgrade; '' close; }
server {
    listen 443 ssl;
    server_name INGEST_HOSTNAME;
    ssl_certificate /etc/company-tls/fullchain.pem;
    ssl_certificate_key /etc/company-tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    location /api/ingest/v1/ {
        limit_req zone=md_ingest burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://ingest:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }
    location = /livez { proxy_pass http://ingest:8000/livez; }
    location / { return 404; }
}
server {
    listen 443 ssl;
    server_name READ_HOSTNAME;
    ssl_certificate /etc/company-tls/fullchain.pem;
    ssl_certificate_key /etc/company-tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 64k;
    location /api/ingest/ { return 404; }
    location / {
        proxy_pass http://read:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $md_connection;
        proxy_read_timeout 75s;
    }
}
